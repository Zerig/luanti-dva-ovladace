name: Luanti 5.17 - dva ovladace
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Fetch exact Luanti release
        shell: pwsh
        run: |
          git clone https://github.com/luanti-org/luanti.git source
          if ($LASTEXITCODE) { throw 'Clone failed' }
          git -C source checkout c0e6812b1a4260bb25a1f606f70f55f4962bb97d
          if ($LASTEXITCODE) { throw 'Checkout failed' }
      - name: Apply local multiplayer patch
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$pwd/source/two-gamepads.patch", [Convert]::FromBase64String(''))
          git -C source apply --check two-gamepads.patch
          if ($LASTEXITCODE) { throw 'Patch check failed' }
          git -C source apply two-gamepads.patch
          if ($LASTEXITCODE) { throw 'Patch failed' }
      - name: Prepare dependencies
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git deps
          if ($LASTEXITCODE) { throw 'vcpkg clone failed' }
          ./deps/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { throw 'Bootstrap failed' }
      - name: Configure
        shell: pwsh
        run: |
          cmake -S source -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$pwd/deps/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DENABLE_POSTGRESQL=OFF -DENABLE_LUAJIT=TRUE -DREQUIRE_LUAJIT=TRUE -DRUN_IN_PLACE=1
          if ($LASTEXITCODE) { throw 'Configure failed' }
      - name: Build and package
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE) { throw 'Build failed' }
          cpack --config build/CPackConfig.cmake -C Release -G ZIP -B package
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          $zip = Get-ChildItem package/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath unpacked
          $exe = Get-ChildItem unpacked -Filter luanti.exe -Recurse | Select-Object -First 1
          if (!$exe) { throw 'Executable missing' }
          & $exe.FullName --version
          if ($LASTEXITCODE) { throw 'Runtime check failed' }
          $root = $exe.Directory.Parent.FullName
          [IO.File]::WriteAllBytes("$root/Spustit-dva-hrace.cmd", [Convert]::FromBase64String(''))
          New-Item -ItemType Directory output
          Compress-Archive -Path "$root/*" -DestinationPath output/Luanti-5.17-dva-ovladace.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Luanti-5.17-dva-ovladace
          path: output/*.zip
          if-no-files-found: error
